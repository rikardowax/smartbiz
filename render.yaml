services:
  - type: web
    name: smartbiz-api
    runtime: node
    plan: starter
    branch: master
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @smartbiz/api build
    startCommand: pnpm --filter @smartbiz/api start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGINS
        value: https://smartbiz-web.onrender.com
      - key: WEB_APP_URL
        value: https://smartbiz-web.onrender.com
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartbiz-db
          property: connectionString
      - key: GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_CLIENT_ID
      - key: WHATSAPP_TOKEN
      - key: WHATSAPP_PHONE_NUMBER_ID
      - key: WHATSAPP_VERIFY_TOKEN
        value: smartbiz-verify-token
      - key: WHATSAPP_API_VERSION
        value: v20.0

  - type: web
    name: smartbiz-web
    runtime: node
    plan: starter
    branch: master
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @smartbiz/web build
    startCommand: pnpm --filter @smartbiz/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NEXT_PUBLIC_API_URL
        value: https://smartbiz-api.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID

databases:
  - name: smartbiz-db
    plan: starter
    region: frankfurt
